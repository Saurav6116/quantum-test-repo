name: PQC Security Scan
on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the new branch
      pull-requests: write # Required to open the PR
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run QuantumGuard Scanner & Auto-Remediate
        uses: sauravvyas/quantum-guard-action@v1.0.2
        with:
          license_key: ${{ secrets.QUANTUMGUARD_LICENSE_KEY }}
          auto_remediate: 'true'

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "security: migrate to hybrid post-quantum cryptography"
          title: "🔐 QuantumGuard: Auto-Remediate Legacy Cryptography"
          body: "QuantumGuard detected vulnerable legacy cryptography and automatically rewrote your code to use the hybrid PQC library."
          branch: "security/quantumguard-remediation"
          delete-branch: true
